# Publica o site rapidaoservico.com.br na Hostinger a cada envio para a main.
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   FTP_SERVIDOR  o servidor FTP que o hPanel mostra (ex.: ftp.rapidaoservico.com.br)
#   FTP_USUARIO   o usuário da conta FTP do site rapidaoservico.com.br
#   FTP_SENHA     a senha dessa conta
#
# A conta FTP tem de ser a do site rapidaoservico.com.br, com a pasta
# public_html. Nunca a de outro site da mesma hospedagem.

name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Ensaio: lista o que subiria, sem enviar nada"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Gerar o site
        run: npm run build

      - name: Conferir o pacote
        run: |
          pasta=dist/apps/web/client
          test -f "$pasta/index.html" || { echo "O build não gerou o index.html."; exit 1; }
          rm -f "$pasta/__spa-fallback.html"
          if find "$pasta" -name ".env*" | grep -q .; then echo "PAREI: há .env no pacote."; exit 1; fi
          echo "Pacote:"; ls -la "$pasta"

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          local-dir: ./dist/apps/web/client/
          server-dir: ./
          dry-run: ${{ inputs.ensaio == true }}

      - name: Conferir no ar
        if: ${{ inputs.ensaio != true }}
        run: |
          sleep 5
          curl -sf https://rapidaoservico.com.br/ | grep -q "Rapidão" && echo "No ar." || { echo "O site não respondeu como esperado."; exit 1; }
